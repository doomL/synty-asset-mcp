[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synty-asset-mcp"
version = "0.1.0"
description = "MCP server: search, preview, extract and convert your own licensed Synty assets for Three.js and Godot"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
  # Catalog engine. Pinned to a reviewed commit; used as a library, never patched.
  "synty-inventory @ git+https://github.com/tom-swift-tech/synty-inventory@7eee0bce9b28fe149db593375c385c2d278073a5",
  "mcp>=2.3,<3",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
store = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
synty-mcp = "synty_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synty_mcp = ["data/*.yaml", "data/*.json", "web/*", "web/**/*", "convert/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "blender: needs a Blender executable (SYNTY_MCP_BLENDER or blender on PATH)",
  "live: needs licensed Synty files on this machine (SYNTY_MCP_LIVE_SOURCE)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "E731", "B905"]
